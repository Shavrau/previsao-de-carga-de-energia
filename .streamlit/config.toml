[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "0.625rem"
showWidgetBorder = true

[theme.dark]
primaryColor = "#0ea5e9"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#111827"
textColor = "#f3f4f6"
borderColor = "#1f2937"

[theme.light]
primaryColor = "#0284c7"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#e2e8f0"
