services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  pipeline:
    build: .
    profiles: ["pipeline"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
