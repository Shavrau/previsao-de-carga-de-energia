version: 2

sources:
  - name: bronze
    meta:
      external_location: "read_parquet('data/bronze/CARGA_ENERGIA_*.parquet', union_by_name=true)"
    tables:
      - name: carga_energia_diaria
        description: "Dados brutos anuais de carga diária por subsistema do ONS (2018 até hoje)."
        columns:
          - name: id_subsistema
            description: "Código do subsistema (SE, S, NE, N)."
          - name: nom_subsistema
            description: "Nome completo do subsistema."
          - name: din_instante
            description: "Data de referência da medição diária."
          - name: val_cargaenergiamwmed
            description: "Valor da carga de energia diária em MWmed (VARCHAR em 2018-2021, DOUBLE em 2022-2026)."
