[project]
name = "previsao-de-carga-de-energia"
version = "0.1.0"
description = "Pipeline de previsão de carga de energia diária do subsistema Sudeste/Centro-Oeste (ONS) para os próximos 7 dias."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=1.1.0",
    "holidays>=0.108",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
